[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quickaside-gateway"
version = "0.1.0"
description = "Authenticated AI interpretation gateway for Quick Aside"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quickaside_gateway*"]

[tool.setuptools.package-data]
quickaside_gateway = ["provider_output_schema.json"]
