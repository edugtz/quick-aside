[Service]
EnvironmentFile=/etc/quickaside-gateway/caddy.env

# Private Caddy control-plane directory.
# Owned by the caddy service user; Quick Aside must not traverse it.
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0700

# Reload must execute inside the caddy.service environment so the
# Caddyfile sees the same QUICKASIDE_PUBLIC_HOST contract as startup.
#
# The empty assignment resets the ExecReload inherited from the base unit.
ExecReload=
ExecReload=/usr/bin/caddy reload --address unix//run/caddy-admin/admin.sock --config /etc/caddy/Caddyfile --adapter caddyfile --force
